version: 1
runtime: forge
profile: rust-product
rule_pack: forge-baseline/1.0.0
checks:
  repository: true
  build: true
  tests: true
  security: true
  declared-verification: true
  placeholder-threshold: true
  product-code-boundary: true
blocking:
  - FAIL
  - REVIEW_REQUIRED

# Per-check execution deadlines. Unlisted checks take the runtime default
# (60s). `build` compiles the workspace and `tests`/`declared-verification`
# run the fast suite, so a cold runner needs more than the local warm path.
# The CI gate job also warms the workspace before invoking the runtime.
timeouts:
  build: 300000
  tests: 900000
  declared-verification: 900000

commands:
  # Generated from .project.json verification.command by workspace-governance/scripts/bind_verification_command.py.
  # A verifier that no gate runs does not gate (ruling D18). Re-run the
  # generator to update it; do not hand-edit.
  # Generated by workspace-governance/scripts/bind_gate_commands.py from the files on disk in this
  # repository, for the concerns this manifest already selects under
  # `checks:`. A verifier that no gate runs does not gate (ruling D18).
  # Re-run the generator to update these; do not hand-edit. Concerns it
  # could not derive are recorded in gate-debt.json, not guessed.
  repository: 'git diff --check'
  build: 'cargo build --workspace'
  security: 'cargo audit'
  # placeholder-threshold and product-code-boundary are vendored into
  # scripts/governance/ so the gate is self-contained: they only read the repo
  # root and the committed scripts/vocabulary.json, with no sibling dependency.
  placeholder-threshold: 'python3 scripts/governance/product_code_quality.py .'
  product-code-boundary: 'python3 scripts/governance/product_code_quality.py .'
  # Generated from .project.json verification.command by workspace-governance/scripts/bind_verification_command.py.
  # A verifier that no gate runs does not gate (ruling D18). Re-run the
  # generator to update it; do not hand-edit.
  # `--test-threads=1`: this sandbox's tmpfs refuses to exec freshly-written
  # fixture scripts under concurrent load (ETXTBSY / "Text file busy"), which
  # makes the gate-engine tests flake in parallel. Serialising matches what
  # `scripts/check-tests.sh` (the `tests` concern) already does and keeps the
  # local Gate rehearsal reliable; CI runners do not exhibit the tmpfs quirk
  # but single-threading is still correct there, just slower.
  declared-verification: 'cargo test --workspace -- --skip rust_scaffold_builds_and_tests_with_native_toolchain --skip rust_scaffold_builds_with_native_toolchain_without_forge --skip declaration_is_inert_for_native_builds_present_and_absent --test-threads=1'
  # Operator binding, not generated. bind_gate_commands.py derives
  # `cargo test --workspace` for a Rust workspace and never consults
  # scripts/check-tests.* for a shape concern, so this entry is written here
  # and the generator preserves it as operator intent — the same arrangement
  # careBridge and openpanel use. scripts/check-tests.sh runs the fast suite
  # CI's `test` job runs; the three native-scaffold tests it skips stay covered
  # by CI's dedicated `native-scaffold` job. Without this binding one Gate run
  # executed a 2220s generated-project build and cost ~46 minutes.
  tests: 'scripts/check-tests.sh'
