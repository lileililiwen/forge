version: 1
runtime: driftwatchdog
profile: rust-product
rule_pack: workspace-governance@1
checks:
  repository: true
  build: true
  tests: true
  security: true
  declared-verification: true
  governance-quality: true
  placeholder-threshold: true
  product-code-boundary: true
blocking:
  - FAIL
  - REVIEW_REQUIRED

# Per-check execution deadlines. Unlisted checks take the runtime default
# (60s). Both test-bearing checks run the same fast suite (~190s), declared
# through `.project.json verification.command` and `scripts/check-tests.sh`
# respectively, so both get the same 600000ms deadline.
timeouts:
  tests: 600000
  declared-verification: 600000

commands:
  # Generated from .project.json verification.command by workspace-governance/scripts/bind_verification_command.py.
  # A verifier that no gate runs does not gate (ruling D18). Re-run the
  # generator to update it; do not hand-edit.
  # Generated by workspace-governance/scripts/bind_gate_commands.py from the files on disk in this
  # repository, for the concerns this manifest already selects under
  # `checks:`. A verifier that no gate runs does not gate (ruling D18).
  # Re-run the generator to update these; do not hand-edit. Concerns it
  # could not derive are recorded in gate-debt.json, not guessed.
  repository: 'git diff --check'
  build: 'cargo build --workspace'
  security: 'cargo audit'
  governance-quality: 'python3 ../workspace-governance/scripts/workspace_check.py --root .. --project forge --json'
  placeholder-threshold: 'python3 ../workspace-governance/scripts/product_code_quality.py .'
  product-code-boundary: 'python3 ../workspace-governance/scripts/product_code_quality.py .'
  # Generated from .project.json verification.command by workspace-governance/scripts/bind_verification_command.py.
  # A verifier that no gate runs does not gate (ruling D18). Re-run the
  # generator to update it; do not hand-edit.
  declared-verification: 'cargo test --workspace -- --skip rust_scaffold_builds_and_tests_with_native_toolchain --skip rust_scaffold_builds_with_native_toolchain_without_forge --skip declaration_is_inert_for_native_builds_present_and_absent'
  # Operator binding, not generated. bind_gate_commands.py derives
  # `cargo test --workspace` for a Rust workspace and never consults
  # scripts/check-tests.* for a shape concern, so this entry is written here
  # and the generator preserves it as operator intent — the same arrangement
  # careBridge and openpanel use. scripts/check-tests.sh runs the fast suite
  # CI's `test` job runs; the three native-scaffold tests it skips stay covered
  # by CI's dedicated `native-scaffold` job. Without this binding one Gate run
  # executed a 2220s generated-project build and cost ~46 minutes.
  tests: 'scripts/check-tests.sh'
