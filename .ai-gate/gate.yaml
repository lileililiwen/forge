version: 1
runtime: driftwatchdog
profile: rust-product
rule_pack: workspace-governance@1
checks:
  repository: true
  build: true
  tests: true
  security: true
  declared-verification: true
blocking:
  - FAIL
  - REVIEW_REQUIRED

commands:
  # Generated from .project.json verification.command by workspace-governance/scripts/bind_verification_command.py.
  # A verifier that no gate runs does not gate (ruling D18). Re-run the
  # generator to update it; do not hand-edit.
  declared-verification: 'cargo test --workspace'
