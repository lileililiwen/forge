# cargo-audit policy for Forge. Mirrors the exception recorded in
# deny.toml so the `deny` CI job's `cargo audit` step agrees with
# `cargo deny check`.
#
# RUSTSEC-2023-0071 (Marvin Attack: potential key recovery through timing
# sidechannels) is the `rsa` crate's private-key decryption timing leak, pulled
# transitively by `openidconnect` for OIDC ID-token verification
# (`portal-browser-sign-in`). Forge only performs RSA signature *verification*
# with the provider's public key; no RSA private-key operation is reachable, so
# the timing oracle cannot be exercised. No fixed release exists upstream.
[advisories]
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]
# RUSTSEC-2026-0387 (crypto-bigint 0.5.5, timing variability in operations
# intended to be constant-time). The same exception and reasoning are recorded
# in deny.toml. The path is
# `openidconnect 4.0.1 -> elliptic-curve 0.13.8 -> crypto-bigint 0.5.5`;
# Forge verifies ID-token signatures with public keys and never performs a
# private-key or signing operation, so the secret-dependent path is
# unreachable. No fixed openidconnect release exists. Review when
# openidconnect moves to elliptic-curve 0.14 / crypto-bigint >= 0.7.6.
