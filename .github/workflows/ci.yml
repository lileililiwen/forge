name: ci

# Forge's own verification (`artifact-and-ci-baseline`). Each job names only
# the checks it runs. The `artifact` job uploads the packaged archive and
# digest as a workflow artifact; only a matching pushed version tag can run
# the final release job, after every verification job passes. A required tool
# that is absent fails loudly — never a skip to green. Local contract checks:
# `scripts/release-check.sh` runs the same offline asset and schema validation.

on:
  push:
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned contract schema validator
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate Forge-owned contract assets and fixtures
        run: |
          node scripts/check-contracts.mjs
          python3 tests/contract_schema_tests.py
      - name: Install driftwatchdog (forge check runtime)
        run: |
          curl -fsSL https://github.com/lileililiwen/driftwatchdog/releases/latest/download/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fast test suite (native scaffold builds run in native-scaffold)
        run: cargo test --workspace --all-targets -- --skip rust_scaffold_builds_and_tests_with_native_toolchain --skip rust_scaffold_builds_with_native_toolchain_without_forge --skip declaration_is_inert_for_native_builds_present_and_absent --test-threads=1

  native-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native scaffold evidence (generated tree builds without Forge)
        run: >
          cargo test --workspace --all-targets --
          rust_scaffold_builds_and_tests_with_native_toolchain
          rust_scaffold_builds_with_native_toolchain_without_forge
          declaration_is_inert_for_native_builds_present_and_absent

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: "Floor toolchain (ADR 0002, binding: OsStr::display)"
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check at the declared rust-version floor
        run: cargo check --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny and cargo-audit (fails loudly when unavailable)
        run: |
          cargo install cargo-deny --locked || { echo "deny blocked: cargo-deny is unavailable" >&2; exit 1; }
          cargo install cargo-audit --locked || { echo "deny blocked: cargo-audit is unavailable" >&2; exit 1; }
      - name: Dependency and licence policy
        run: cargo deny check
      - name: Security advisories
        run: cargo audit

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: OpenSpec name and governance checks
        run: |
          node scripts/check-openspec-change-names.mjs
          node scripts/check-spec-governance.mjs
      - name: Strict OpenSpec validation
        run: |
          command -v openspec >/dev/null 2>&1 || { echo "governance blocked: openspec CLI is unavailable" >&2; exit 1; }
          openspec validate --all --strict --no-interactive
      - name: Whitespace check
        run: git diff --check

  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install driftwatchdog (forge check runtime)
        run: |
          curl -fsSL https://github.com/lileililiwen/driftwatchdog/releases/latest/download/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build Forge
        run: cargo build
      - name: Readiness matrix (every supported profile, informational)
        run: ./target/debug/forge readiness matrix
      - name: Readiness gate (runner-qualified rows only)
        run: ./target/debug/forge readiness check --profile rust-web --profile nextjs-web --profile aspnet-web

  surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install driftwatchdog (forge check runtime)
        run: |
          curl -fsSL https://github.com/lileililiwen/driftwatchdog/releases/latest/download/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build Forge
        run: cargo build
      - name: Read-only surfaces (doctor, checker, fleet, providers)
        run: |
          ./target/debug/forge doctor .
          ./target/debug/forge check . --format json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "alerts" in d, sorted(d.keys())'
          ./target/debug/forge fleet list
          ./target/debug/forge provider matrix

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Forge
        run: cargo build
      - name: Real Forge gate verdict
        run: |
          ./target/debug/forge gate .
          ./target/debug/forge gate status .

  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/validate-release-tag.sh "$GITHUB_REF_NAME"
      - name: Package, verify digest, install to scratch prefix, smoke-test
        run: |
          scripts/package.sh
          ARCHIVE="$(ls -t dist/forge-*.tar.gz | head -n 1)"
          scripts/checksum.sh --verify "$ARCHIVE"
          mkdir -p /tmp/opencode/forge-install
          scripts/install.sh --archive "$ARCHIVE" --prefix /tmp/opencode/forge-install
          scripts/smoke.sh --bin /tmp/opencode/forge-install/bin/forge
          tar -tzf "$ARCHIVE" | grep -v '^forge-[^/]*/[^/]*$' && { echo "artifact blocked: archive carries unexpected paths" >&2; exit 1; } || true
          tar -tzf "$ARCHIVE" | grep '^/' && { echo "artifact blocked: archive carries absolute host paths" >&2; exit 1; } || echo "artifact: no absolute host paths"
      - name: Upload archive and digest as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-package
          path: |
            dist/forge-*.tar.gz
            dist/forge-*.tar.gz.sha256
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - fmt
      - clippy
      - test
      - native-scaffold
      - msrv
      - deny
      - governance
      - readiness
      - surfaces
      - gate
      - artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forge-package
          path: dist
      - name: Verify release payload
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_VERSION#v}"
          archive="dist/forge-${version}-x86_64-unknown-linux-gnu.tar.gz"
          [ -f "$archive" ] || { echo "release blocked: expected asset $archive is missing" >&2; exit 1; }
          [ -f "$archive.sha256" ] || { echo "release blocked: expected checksum $archive.sha256 is missing" >&2; exit 1; }
          basename="${archive#dist/}"
          (cd dist && sha256sum --check "$basename.sha256")
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_VERSION#v}"
          archive="dist/forge-${version}-x86_64-unknown-linux-gnu.tar.gz"
          gh release create --repo lileililiwen/forge "$RELEASE_VERSION" "$archive" "$archive.sha256" \
            --verify-tag \
            --title "Forge $version" \
            --generate-notes
