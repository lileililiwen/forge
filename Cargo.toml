[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "Forge developer control plane: versioned project model, persistent registry and CLI foundation"
license = "MIT"

[[bin]]
name = "forge"
path = "src/main.rs"

[lib]
name = "forge"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
