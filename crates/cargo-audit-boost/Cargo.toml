[package]
name = "cargo-audit-boost"
version = "0.1.0"
edition = "2024"
authors = ["Paul"]
description = "A blazing fast Cargo build performance profiling and metric tool."
repository = "https://github.com/lileililiwen/forge"
homepage = "https://github.com/lileililiwen/forge/tree/main/crates/cargo-audit-boost"

[dependencies]
# 1. CLI parsing
clap = { version = "4.4", features = ["derive", "env"] }

# 2. Async runtime and stream processing
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# 3. Serialization and deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 4. Terminal UI rendering
ratatui = "0.30"
crossterm = "0.27"

# 5. Error handling and diagnostics logging
anyhow = "1.0"
tracing = "0.1"
