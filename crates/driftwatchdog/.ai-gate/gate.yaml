version: 1
runtime: driftwatchdog
profile: rust-product
rule_pack: forge-baseline/1.0.0
checks:
  repository: true
  build: true
  tests: true
  security: true
  declared-verification: true
  placeholder-threshold: true
  product-code-boundary: true
blocking:
  - FAIL
  - REVIEW_REQUIRED

commands:
  # Generated by Forge from .project.json verification.command.
  # A verifier that no gate runs does not gate (ruling D18). Re-run the
  # generator to update it; do not hand-edit.
  declared-verification: 'cargo test --workspace --all-targets'
  # Generated by Forge from files on disk in this repository for concerns
  # already selected under
  # `checks:`. A verifier that no gate runs does not gate (ruling D18).
  # Re-run the generator to update these; do not hand-edit. Concerns it
  # could not derive are recorded in gate-debt.json, not guessed.
  repository: 'git diff --check'
  build: 'cargo build'
  tests: 'cargo test'
  security: 'cargo audit'
  placeholder-threshold: 'forge concern check placeholder-threshold .'
  product-code-boundary: 'forge concern check product-code-boundary .'
