# cargo-deny policy for Forge (`artifact-and-ci-baseline`).
#
# Covers advisories, licences, bans and duplicate versions. Every exception
# carries a reason; no wildcard allow-list exists.

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "Zlib",
  "BSL-1.0",
  "Unlicense",
  # r-efi (via getrandom/wasm transitive deps) is LGPL-2.1-or-later. It is a
  # target-specific UEFI shim never linked into the Linux binary; allowed
  # explicitly here rather than by a blanket copyleft wildcard.
  "LGPL-2.1-or-later",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
