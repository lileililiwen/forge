# cargo-deny policy for Forge (`artifact-and-ci-baseline`).
#
# Covers advisories, licences, bans and duplicate versions. Every exception
# carries a reason; no wildcard allow-list exists.

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# RUSTSEC-2023-0071 (Marvin Attack: potential key recovery through timing
# sidechannels) is the `rsa` crate's private-key decryption timing leak. It is
# pulled transitively by `openidconnect` (browser OIDC ID-token verification,
# `portal-browser-sign-in`). Forge only performs RSA signature *verification*
# with the provider's public key; no RSA private-key operation is reachable, so
# the timing oracle this advisory describes cannot be exercised. No fixed
# release exists upstream. The dependency is pinned to `openidconnect` 4.x,
# which also removes the older `rustls-webpki`/`h2` advisories from the
# `reqwest` 0.11 stack.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa private-key decryption timing leak; Forge only does public-key signature verification, so the affected code path is unreachable" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "Zlib",
  "BSL-1.0",
  "Unlicense",
  # webpki-roots (the Mozilla CA bundle consumed by rustls through
  # `reqwest`'s rustls-tls transport, `portal-browser-sign-in`) ships the
  # trust-anchor data under CDLA-Permissive-2.0. That is a permissive data
  # licence with no copyleft obligation; recorded explicitly rather than via a
  # wildcard so the closure change stays visible.
  "CDLA-Permissive-2.0",
  # r-efi (via getrandom/wasm transitive deps) is LGPL-2.1-or-later. It is a
  # target-specific UEFI shim never linked into the Linux binary; allowed
  # explicitly here rather than by a blanket copyleft wildcard.
  "LGPL-2.1-or-later",
  # maud (portal-web-ui D1) and maud_macros share the dual MIT OR
  # Apache-2.0 declaration with the allow-list above; the reason is
  # recorded here as a single entry per crate so the closure change is
  # explicit. itoa (transitive of maud) is MIT OR Apache-2.0 too.
  # No new entries needed: MIT and Apache-2.0 are already allow-listed.
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
