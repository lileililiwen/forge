[workspace]
resolver = "2"
members = [
    "crates/forge-identity-provider",
    "crates/keycloak-pack",
    "crates/supabase-pack",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
forge-identity-provider = { path = "crates/forge-identity-provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
