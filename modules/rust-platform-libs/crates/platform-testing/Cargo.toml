[package]
name = "platform-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Deterministic fakes, builders, and assertions for testing platform code."
documentation = "https://docs.rs/platform-testing"
keywords = ["platform", "rust", "testing", "fakes", "test-doubles", "deterministic"]
