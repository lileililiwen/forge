name: governance

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/auto_gate.py --self-check --report auto-gate-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-auto-gate-report
          path: auto-gate-report.json
      - run: git diff --check
