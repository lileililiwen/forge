version = 1
profile = "governance"
rule_pack_version = "workspace-governance@1"

[[checks]]
id = "declared-verification"
command = "python3 -m unittest discover -s tests -v"

[[checks]]
id = "governance-quality"
# The module checks itself. `--root ..` would make the workspace root this
# module's parent directory inside the Forge tree, and the registry's project
# paths are relative to the workspace root, so every registered project would
# report PROJECT_MISSING against a directory that does not exist there.
# `--self-check` roots the audit at the module that owns the registry.
command = "python3 ../workspace-governance/scripts/workspace_check.py --self-check --json"

[[checks]]
id = "product_quality"
command = "python3 scripts/product_code_quality.py ."

[[checks]]
id = "repository"
command = "git diff --check"

[[checks]]
id = "security"
command = "pip-audit -r requirements-dev.txt"

[[checks]]
id = "tests"
command = "python3 -m unittest discover -s tests -v"

[blocking]
review_required_blocks = true

[source_size]
include = ["scripts/**/*.py"]
