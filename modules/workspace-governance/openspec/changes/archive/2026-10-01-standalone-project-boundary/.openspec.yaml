title: Standalone project boundary classification
description: |
  Classify a discovered project as standalone, library-dependent,
  workspace-dependent, service-dependent, or blocked without executing
  project commands. Additive optional `standalone` and `integrations`
  declaration fields, repository-relative audit, and normalized Forge
  adapter observations. No schema migration; existing declarations
  remain valid.
