services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: {{project_name}}:local
    environment:
      DATABASE_URL: postgresql://app:$${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/{{database_name}}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: {{database_name}}
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - {{project_name}}-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d {{database_name}}"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  {{project_name}}-postgres:
