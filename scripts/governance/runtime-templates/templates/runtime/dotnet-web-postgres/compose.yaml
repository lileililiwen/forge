services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PROJECT: {{app_project}}
    image: {{project_name}}:local
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=db;Port=5432;Database={{database_name}};Username=app;Password=$${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "{{port}}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080{{health_path}} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: {{database_name}}
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - {{project_name}}-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d {{database_name}}"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  {{project_name}}-postgres:
