services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: {{project_name}}:local
    environment:
      PGHOST: $${PGHOST:?set PGHOST in .env}
      PGPORT: $${PGPORT:-5432}
      PGUSER: $${PGUSER:?set PGUSER in .env}
      PGDATABASE: $${PGDATABASE:?set PGDATABASE in .env}
      PGPASSWORD: $${PGPASSWORD:?set PGPASSWORD in .env}
      DATABASE_URL: postgresql://$${PGUSER}:$${PGPASSWORD}@$${PGHOST}:$${PGPORT:-5432}/$${PGDATABASE}
      PORT: 8000
    ports:
      - "{{port}}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000{{health_path}} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
