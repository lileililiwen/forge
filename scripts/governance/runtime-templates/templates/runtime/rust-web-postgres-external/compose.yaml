services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PROJECT: {{app_project}}
    image: {{project_name}}:local
    environment:
      PGHOST: $${PGHOST:?set PGHOST in .env}
      PGPORT: $${PGPORT:-5432}
      PGUSER: $${PGUSER:?set PGUSER in .env}
      PGDATABASE: $${PGDATABASE:?set PGDATABASE in .env}
      PGPASSWORD: $${PGPASSWORD:?set PGPASSWORD in .env}
      DATABASE_URL: postgres://$${PGUSER}:$${PGPASSWORD}@$${PGHOST}:$${PGPORT:-5432}/$${PGDATABASE}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
    ports:
      - "{{port}}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080{{health_path}} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
